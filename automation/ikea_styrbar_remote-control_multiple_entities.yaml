blueprint:
  name: IKEA Styrbar (ZHA) - Smooth & Complete
  description: >-
    ZHA Styrbar driving several lights/switches. The arrows cycle which entity is
    selected (using the bulb's own flash where it supports one, otherwise a blink
    that is put back afterwards), on/off toggles the selected entity, and holding
    on/off dims it using absolute brightness steps. Transition and brightness
    support are detected per entity, so non-Zigbee (Wi-Fi) bulbs and plain on/off
    lights work too. A selection flash never writes a brightness value, so the
    level a bulb returns to when switched back on is left untouched.
  domain: automation
  input:
    switch_remote:
      name: Styrbar switch remote
      selector:
        device:
          integration: zha
    targets:
      name: Light/Switch Entities
      selector:
        entity:
          multiple: true
          filter:
            - domain: [light, switch]
    selected_target:
      name: Target Index Helper
      selector:
        entity:
          domain: input_number
    enable_flash:
      name: Enable Selection Flash
      default: true
      selector:
        boolean: {}
    flash_duration:
      name: Selection Flash Length (ms)
      description: "Only used for entities without a built-in flash (Wi-Fi bulbs, switches, and any light that is currently off). Bulbs with a native flash blink at their own speed."
      default: 300
      selector:
        number: {min: 100, max: 1500, step: 50, mode: slider}
    force_brightness:
      name: Force Brightness
      default: false
      selector:
        boolean: {}
    brightness_pct:
      name: Forced Brightness Level (%)
      default: 50
      selector:
        number: {min: 0, max: 100, mode: slider}
    repeat_delay:
      name: Dimming Speed (ms)
      description: "Time between dim steps. Raise this to 250-400 for cloud-connected Wi-Fi bulbs, which cannot keep up with fast command bursts."
      default: 150
      selector:
        number: {min: 50, max: 1000, step: 10, mode: slider}
    brightness_step_pct:
      name: Dimming Step (%)
      default: 10
      selector:
        number: {min: 1, max: 100, mode: slider}
    transition_time:
      name: Transition Smoothness (s)
      description: "How long the bulb takes to reach the next brightness level. Try 0.2 to 0.4 for smoothness. Ignored for lights that do not support transitions."
      default: 0.3
      selector:
        number: {min: 0, max: 2, step: 0.1, mode: slider}
    arrow_hold_behavior:
      name: Arrow long-press behaviour
      description: >-
        What holding an arrow does. "Custom actions" runs the two long-press
        actions at the bottom of this form, which is the original behaviour.
        "Adjust colour temperature" ramps the selected light while the arrow is
        held: left towards warm, right towards cold. Lights that have no
        tunable white are left alone.
      default: custom
      selector:
        select:
          options:
            - label: Run the custom long-press actions
              value: custom
            - label: Adjust colour temperature (left warmer, right colder)
              value: color_temp
    color_temp_step:
      name: Colour Temperature Step (K)
      description: >-
        Kelvin added or removed per step while an arrow is held. The ramp is
        paced by "Dimming Speed" above and stops at whatever range the bulb
        reports, so it never has to be tuned per bulb. The default crosses a
        typical bulb's whole range in roughly three seconds; raise it if that
        feels sluggish, lower it if the ends arrive too fast to stop on a
        middle value. Only used when the setting above is "Adjust colour
        temperature".
      default: 100
      selector:
        number: {min: 25, max: 1000, step: 25, mode: slider}
    arrow_left_hold:
      name: Long press - left
      default: []
      selector: {action: {}}
    arrow_left_release:
      name: Release press - left
      default: []
      selector: {action: {}}
    arrow_right_hold:
      name: Long press - right
      default: []
      selector: {action: {}}
    arrow_right_release:
      name: Release press - right
      default: []
      selector: {action: {}}

mode: restart

trigger:
  - platform: event
    event_type: zha_event
    event_data:
      device_id: !input switch_remote

action:
  - variables:
      target_entities: !input targets
      helper: !input selected_target
      flash_enabled: !input enable_flash
      flash_ms: !input flash_duration
      force_br: !input force_brightness
      br_val: !input brightness_pct
      step_val: !input brightness_step_pct
      delay_val: !input repeat_delay
      trans_val: !input transition_time
      hold_behavior: !input arrow_hold_behavior
      ct_step: !input color_temp_step

      # Never dim all the way to black - the bulb becomes unrecoverable by remote.
      min_br: 15

      # Event Data
      command: "{{ trigger.event.data.command }}"
      cluster_id: "{{ trigger.event.data.cluster_id | int(0) }}"

      # First positional argument, as a number. ZHA delivers command arguments
      # as a positional list on some versions and as a named-parameter dict on
      # others, hence the shape tests.
      #
      # The int() conversions have to happen HERE, against the live event, and
      # the raw list must never be parked in a variable on the way. ZHA passes
      # zigpy enums (MoveMode.Down and friends); a variable is rendered to text
      # and parsed back, that text is "<MoveMode.Down: 1>", which is not a
      # Python literal, so the whole list silently degrades into a string and
      # every shape test below would miss. int() on the live enum yields 1.
      #
      # -1 means nothing was readable, which must stay distinct from a real 0.
      a0: >-
        {%- set d = trigger.event.data -%}
        {%- if d.args is defined and d.args is mapping and d.args | count > 0 -%}
          {{ d.args.values() | list | first | int(-1) }}
        {%- elif d.args is defined and d.args is sequence and d.args is not string and d.args | count > 0 -%}
          {{ d.args[0] | int(-1) }}
        {%- elif d.params is defined and d.params is mapping and d.params | count > 0 -%}
          {{ d.params.values() | list | first | int(-1) }}
        {%- else -%}
          -1
        {%- endif -%}

      # Determine active entity
      current_idx: "{{ states(helper) | int(0) }}"
      active_entity: "{{ target_entities[current_idx] if current_idx < target_entities | count else target_entities[0] }}"

      # Snapshot scene used to undo a hand-made selection blink. Keyed on the
      # index helper so two Styrbar instances never share one.
      flash_scene: "scene.styrbar_flash_{{ helper.split('.')[1] }}"

      # Colour temperature needs no helper: the current value is read off the
      # bulb and the range is whatever the bulb reports. Anything without a
      # tunable white falls through to the custom actions rather than erroring.
      # Must stay below active_entity - variables render in order.
      ct_ready: >-
        {{ hold_behavior == 'color_temp'
           and active_entity.split('.')[0] == 'light'
           and 'color_temp' in (state_attr(active_entity, 'supported_color_modes') | default([], true)) }}

  - choose:
      # 1. CYCLING (Cluster 5)
      - conditions: "{{ command == 'press' and cluster_id == 5 }}"
        sequence:
          # mode: restart can kill a run mid-blink, leaving that entity inverted.
          # Undo any snapshot still outstanding before taking a new one.
          - if:
              - condition: template
                value_template: "{{ states(flash_scene) not in ['unknown', 'unavailable'] }}"
            then:
              - service: scene.turn_on
                target: { entity_id: "{{ flash_scene }}" }
                continue_on_error: true
              - service: scene.delete
                target: { entity_id: "{{ flash_scene }}" }
                continue_on_error: true

          - variables:
              is_right: "{{ a0 | int(0) == 256 }}"
              new_idx: >-
                {%- set n = target_entities | count -%}
                {{ ((current_idx + 1) % n) if is_right else ((current_idx - 1 + n) % n) }}
          - service: input_number.set_value
            target: { entity_id: "{{ helper }}" }
            data:
              value: "{{ new_idx }}"

          - condition: template
            value_template: "{{ flash_enabled }}"

          - variables:
              flash_entity: "{{ target_entities[new_idx | int(0)] }}"
              # Zigbee bulbs implement the FLASH feature (supported_features bit
              # 8) natively - the bulb blinks itself and settles back on its own
              # state. Wi-Fi bulbs and switches generally do not.
              flash_native: >-
                {{ target_entities[new_idx | int(0)].split('.')[0] == 'light'
                   and state_attr(target_entities[new_idx | int(0)], 'supported_features')
                       | int(0) | bitwise_and(8) > 0 }}

          - choose:
              # Lit bulb with a built-in flash: nothing in Home Assistant
              # changes, so there is nothing to snapshot or put back.
              - conditions: "{{ flash_native and is_state(flash_entity, 'on') }}"
                sequence:
                  - service: light.turn_on
                    target: { entity_id: "{{ flash_entity }}" }
                    data: { flash: short }
                    continue_on_error: true

            # Everything else has to be blinked by hand and restored.
            default:
              - service: scene.create
                data:
                  scene_id: "styrbar_flash_{{ helper.split('.')[1] }}"
                  snapshot_entities: "{{ [flash_entity] }}"
              - choose:
                  - conditions: "{{ is_state(flash_entity, 'on') }}"
                    sequence:
                      - service: homeassistant.turn_off
                        target: { entity_id: "{{ flash_entity }}" }
                        continue_on_error: true
                default:
                  # Deliberately no brightness: naming one would overwrite the
                  # level the bulb returns to the next time it is switched on.
                  - service: homeassistant.turn_on
                    target: { entity_id: "{{ flash_entity }}" }
                    continue_on_error: true
              - delay: { milliseconds: "{{ flash_ms }}" }
              # Restoring an "off" snapshot only switches the entity back off -
              # it writes no brightness either, so the remembered level survives.
              - service: scene.turn_on
                target: { entity_id: "{{ flash_scene }}" }
                continue_on_error: true
              - service: scene.delete
                target: { entity_id: "{{ flash_scene }}" }
                continue_on_error: true

      # 2. POWER (Cluster 6)
      - conditions: "{{ command in ['on', 'off'] }}"
        sequence:
          # Switching off something already off should be a no-op, but ZHA sends
          # turn_off-with-transition as MoveToLevelWithOnOff(level 0), and a bulb
          # that is already dark reads that as "switch on and ramp to the lowest
          # level" rather than staying off. So don't send anything at all.
          # Deliberately limited to the off case: pressing "on" on a lit bulb
          # still goes through, which is what re-applies Force Brightness.
          - condition: template
            value_template: "{{ not (command == 'off' and is_state(active_entity, 'off')) }}"
          - variables:
              can_transition: >-
                {{ active_entity.split('.')[0] == 'light'
                   and state_attr(active_entity, 'supported_features') | int(0) | bitwise_and(32) > 0 }}
              can_dim: >-
                {{ active_entity.split('.')[0] == 'light'
                   and state_attr(active_entity, 'supported_color_modes')
                       | default([], true) | reject('in', ['onoff']) | list | count > 0 }}
          - service: "homeassistant.turn_{{ command }}"
            target: { entity_id: "{{ active_entity }}" }
            data: >-
              {%- set d = {} -%}
              {%- if can_transition -%}{%- set d = dict(d, transition=trans_val) -%}{%- endif -%}
              {%- if command == 'on' and force_br and can_dim -%}{%- set d = dict(d, brightness_pct=br_val) -%}{%- endif -%}
              {{ d }}

      # 3. DIMMING (Cluster 8)
      # Styrbar sends move_with_on_off when holding "on" and move when holding
      # "off", so both have to be matched here.
      - conditions: "{{ command in ['move', 'move_with_on_off', 'step', 'step_with_on_off'] }}"
        sequence:
          - variables:
              can_dim: >-
                {{ active_entity.split('.')[0] == 'light'
                   and state_attr(active_entity, 'supported_color_modes')
                       | default([], true) | reject('in', ['onoff']) | list | count > 0 }}
              can_transition: >-
                {{ active_entity.split('.')[0] == 'light'
                   and state_attr(active_entity, 'supported_features') | int(0) | bitwise_and(32) > 0 }}
              # move_mode / step_mode: 0 = up, 1 = down. Read straight off the
              # live event and coerced here, for the same enum reason as a0.
              move_mode: >-
                {%- set p = trigger.event.data.params -%}
                {%- if p is defined and p is mapping and p.move_mode is defined -%}
                  {{ p.move_mode | int(-1) }}
                {%- elif p is defined and p is mapping and p.step_mode is defined -%}
                  {{ p.step_mode | int(-1) }}
                {%- else -%}
                  -1
                {%- endif -%}
              # Anything unreadable falls through to down, because up always
              # arrives as the distinct *_with_on_off command that the last
              # branch recognises by name.
              is_up: >-
                {%- if move_mode | int(-1) >= 0 -%}
                  {{ move_mode | int(1) == 0 }}
                {%- elif a0 | int(-1) >= 0 -%}
                  {{ a0 | int(1) == 0 }}
                {%- else -%}
                  {{ command.endswith('_with_on_off') }}
                {%- endif -%}
              step_raw: "{{ (step_val | float(10) * 2.55) | round(0) | int }}"

          # Nothing to dim on a switch or an on/off-only bulb.
          - condition: template
            value_template: "{{ can_dim }}"

          - repeat:
              # Bounded so a missed "stop" event (remote out of range) cannot
              # leave this looping forever.
              while: "{{ (repeat.index if repeat is defined else 1) <= 200 }}"
              sequence:
                - variables:
                    current_br: "{{ state_attr(active_entity, 'brightness') | int(0) }}"
                    new_br: >-
                      {%- if is_up -%}
                        {{ [current_br + step_raw, 255] | min | int }}
                      {%- else -%}
                        {{ [current_br - step_raw, min_br] | max | int }}
                      {%- endif -%}

                # Stop at either end of the range instead of spinning.
                - condition: template
                  value_template: "{{ (is_up and current_br < 255) or (not is_up and current_br > min_br) }}"

                - service: light.turn_on
                  target: { entity_id: "{{ active_entity }}" }
                  data: >-
                    {%- set d = {'brightness': new_br | int} -%}
                    {%- if can_transition -%}{%- set d = dict(d, transition=trans_val) -%}{%- endif -%}
                    {{ d }}
                - delay: { milliseconds: "{{ delay_val }}" }

      # 4. STOP (Cluster 8)
      # mode: restart is what actually ends the dim loop above - this branch
      # just keeps the release event from falling through to anything else.
      - conditions: "{{ command in ['stop', 'stop_with_on_off'] }}"
        sequence:
          - stop: "Stopped Dimming"

      # 5. CUSTOM ACTIONS (Cluster 5)
      - conditions: "{{ cluster_id == 5 and command in ['hold', 'release'] }}"
        sequence:
          - choose:
              # Colour temperature ramp. Right (3328) colder, left (3329) warmer.
              # Only claims the "hold" event, so custom release actions still
              # run alongside it if someone has configured them. The matching
              # "release" restarts the automation, which is what ends the ramp -
              # the same mechanism the brightness loop relies on.
              - conditions: >-
                  {{ ct_ready and command == 'hold' and a0 | int(0) in [3328, 3329] }}
                sequence:
                  - variables:
                      can_transition: >-
                        {{ active_entity.split('.')[0] == 'light'
                           and state_attr(active_entity, 'supported_features') | int(0) | bitwise_and(32) > 0 }}
                      colder: "{{ a0 | int(0) == 3328 }}"
                      # The bulb's own limits, so no per-bulb tuning is needed.
                      ct_min: "{{ state_attr(active_entity, 'min_color_temp_kelvin') | int(2000) }}"
                      ct_max: "{{ state_attr(active_entity, 'max_color_temp_kelvin') | int(6500) }}"
                      # Where the ramp starts. A bulb showing no colour
                      # temperature (off, or currently in a colour mode) has no
                      # value to walk from, so start at the middle of its range.
                      ct_start: >-
                        {%- set c = state_attr(active_entity, 'color_temp_kelvin') | int(0) -%}
                        {%- if c > 0 -%}
                          {{ c }}
                        {%- else -%}
                          {{ ((ct_min | int + ct_max | int) / 2) | round(0) | int }}
                        {%- endif -%}

                  - repeat:
                      # Bounded like the brightness loop, in case the release
                      # event is lost to a dropped Zigbee packet.
                      while: "{{ (repeat.index if repeat is defined else 1) <= 200 }}"
                      sequence:
                        # Stepped off ct_start by iteration count rather than by
                        # re-reading the bulb, so a slow light reporting its
                        # state late cannot stall the ramp.
                        - variables:
                            ct_target: >-
                              {%- set delta = (ct_step | int(250)) * (repeat.index | int(1)) -%}
                              {%- set raw = ct_start | int + (delta if colder else -delta) -%}
                              {{ [[raw, ct_min | int] | max, ct_max | int] | min }}

                        - service: light.turn_on
                          target: { entity_id: "{{ active_entity }}" }
                          data: >-
                            {%- set d = {'color_temp_kelvin': ct_target | int} -%}
                            {%- if can_transition -%}
                              {{ dict(d, transition=trans_val) }}
                            {%- else -%}
                              {{ d }}
                            {%- endif -%}
                          continue_on_error: true

                        # Once the end of the bulb's range has been applied there
                        # is nothing further to send, so stop rather than spin.
                        - if:
                            - condition: template
                              value_template: >-
                                {{ ct_target | int == (ct_max if colder else ct_min) | int }}
                          then:
                            - stop: "Reached the end of the bulb's colour temperature range"

                        - delay: { milliseconds: "{{ delay_val }}" }

              # Custom long-press actions (the original behaviour).
              - conditions: "{{ a0 | int(0) == 3329 and command == 'hold' }}"
                sequence: !input arrow_left_hold
              - conditions: "{{ a0 | int(0) == 3329 and command == 'release' }}"
                sequence: !input arrow_left_release
              - conditions: "{{ a0 | int(0) == 3328 and command == 'hold' }}"
                sequence: !input arrow_right_hold
              - conditions: "{{ a0 | int(0) == 3328 and command == 'release' }}"
                sequence: !input arrow_right_release
